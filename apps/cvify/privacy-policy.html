ogies to support functionality, analytics, or service delivery. Where required by applicable law, the Service Provider will obtain consent before using non-essential tracking technologies.</p><h2>Your Rights</h2><p>You may request access to, correction of, or deletion of your personal data held by the Service Provider. To exercise these rights, or to withdraw consent where processing is based on consent, contact the Service Provider at info@flutterninja.com.</p><h2>Your California privacy rights (CCPA/CPRA)</h2><p>If you are a California resident, you have the right to know what personal information is collected, the right to delete personal information, the right to opt out of the sale or sharing of personal information, and the right to non-discrimination for exercising these rights. To exercise your CCPA/CPRA rights, contact the Service Provider at info@flutterninja.com.</p><h2>AI Processing</h2><p>CVify uses third-party Artificial Intelligence (AI) services, includingGoogle Geminiand similar providers, to generate tailored CV and LinkedIn content. AI processing is only triggered when you explicitly use an AI feature inside the app (for example: generating a summary, tailoring a CV to a job description, or refining a section with a prompt).</p><p>Data sent to AI providers:</p><ul><li>The job title, job description, and company name you provide for the tailoring request</li><li>Free-text prompts you type into AI feature screens</li><li>The relevant CV profile fields needed for the request (such as work experience, skills, education, and projects)</li></ul><p>Data NOT sent to AI providers:</p><ul><li>Your name, email address, phone number, or profile picture</li><li>Payment information, subscription identifiers, or transaction history</li><li>Device identifiers, advertising IDs, or push notification (FCM) tokens</li><li>Any content from screens outside the AI feature flows</li></ul><p>Data sent to AI providers is used only to fulfil your immediate request and is governed by the respective AI provider&#x27;s privacy policy. The Service Provider does not use your AI-feature submissions to train third-party models, and the Service Provider does not retain a copy of the data beyond what is required to deliver the result back to you. If you have questions about the AI features or wish to opt out of using them, simply avoid the AI feature screens or contact the Service Provider at info@flutterninja.com.</p><p>The Service Provider may use the information you provide to send important information, required notices, and, where permitted by law, marketing communications.</p><p>For a better experience while using the Application, the Service Provider may require you to provide certain personally identifiable information, including but not limited to Email, Full Name, Phone Number. The information the Service Provider requests will be retained and used as described in this privacy policy.</p><h2>Third Party Access</h2><p>Only aggregated, anonymized data is periodically transmitted to external services to aid the Service Provider in improving the Application and their service. The Service Provider may share your information with third parties in the ways that are described in this privacy statement.</p><h2>International Data Transfers</h2><p>The Service Provider or its third-party service providers may transfer personal data to countries outside your country of residence, including outside the European Economic Area (EEA). Where applicable law requires safeguards for international transfers, the Service Provider will use appropriate mechanisms.</p><ul><li>Standard Contractual Clauses (SCCs) approved by the European Commission</li><li>Adequacy decisions or other legally recognized transfer mechanisms</li><li>Your consent, where required and legally permitted</li></ul><p>Data protection laws in other countries may differ from those in your jurisdiction. Where required by law, the Service Provider will apply appropriate safeguards and obtain any consent required for the transfer.</p><p>Please note that the Application utilizes third-party services that have their own Privacy Policy about handling data. Below are the links to the Privacy Policy of the third-party service providers used by the Application:</p><ul><li>Google Play Services</li><li>AdMob</li><li>Google Analytics for Firebase</li></ul><p>The Service Provider may disclose User Provided and Automatically Collected Information:</p><ul><li>as required by law, such as to comply with a subpoena, or similar legal process;</li><li>when they believe in good faith that disclosure is necessary to protect their rights, protect your safety or the safety of others, investigate fraud, or respond to a government request;</li><li>with their trusted services providers who work on their behalf, do not have an independent use of the information the Service Provider discloses to them, and have agreed to adhere to the rules set forth in this privacy statement.</li></ul><h2>Opt-Out Rights</h2><p>You can stop further collection of information from your mobile device by uninstalling the Application. Uninstalling will stop the Application from collecting data from your device, but it does not automatically delete information that has already been transmitted to the Service Provider or to third parties.</p><p>To request deletion of your personal data, to withdraw consent, or to exercise any of your rights, contact the Service Provider at info@flutterninja.com.</p><h2>Data Retention Policy</h2><p>The Service Provider retains personal data based on its necessity for the stated purposes:</p><ul><li>User Provided Data: Retained for the duration of your use of the Application plus 12 months thereafter, unless longer retention is required by law</li><li>Automatically Collected Data: Retained for up to 24 months from collection, unless longer retention is required for legal compliance</li><li>Aggregated and Anonymized Data: Retained indefinitely as it no longer identifies you</li><li>Data required for legal compliance: Retained as long as required by applicable law</li></ul><p>You may request deletion of your personal data, subject to any legal obligation to retain it. If you want the Service Provider to delete User Provided Data submitted through the Application, please contact them at info@flutterninja.com. Please note that some User Provided Data may be required for the Application to function properly.</p><h2>Children</h2><p>The Application is not intended for children under 16 years of age, or such higher age as required by applicable law. The Service Provider does not knowingly solicit data from children or market the Application to them.</p><p>Where parental or guardian consent is required under applicable law, the Application is not intended for use without that consent. The Service Provider does not knowingly collect personally identifiable information from children under 16 years of age in violation of applicable law. In the event the Service Provider discovers that a child has provided personal information, the Service Provider will immediately delete this from their servers. If you are a parent or guardian and you are aware that your child has provided the Service Provider with personal information, please contact the Service Provider (info@flutterninja.com) so that they will be able to take the necessary actions.</p><h2>Security</h2><p>The Service Provider is concerned about safeguarding the confidentiality of your information. The Service Provider provides physical, electronic, and procedural safeguards to protect information the Service Provider processes and maintains.</p><h2>Data Breach Notification</h2><p>If a data breach occurs that affects your personal data, the Service Provider will notify you in accordance with applicable legal requirements, including, where required, providing information about the nature of the breach and the steps being taken to address it.</p><h2>Changes</h2><p>The Service Provider may update
